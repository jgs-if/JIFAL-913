<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    
<form class="flex-form">
  <h2>Fale Conosco</h2>

  <div class="form-group">
    <label for="assunto">O que você deseja?</label>
    <select id="assunto" name="assunto">
      <option value="reclamar">Reclamar</option>
      <option value="sugerir">Sugerir</option>
      <option value="contatar">Contatar</option>
      <option value="recurso">Pedir Recurso</option>
    </select>
  </div>

  <div class="form-group">
    <label for="mensagem">Sua Mensagem:</label>
    <textarea id="mensagem" rows="4" placeholder="Descreva aqui o motivo do seu contato..."></textarea>
  </div>

  <button type="submit">Enviar Solicitação</button>
</form>


</body>
</html>
